- id: elisp-checkdoc
  name: elisp checkdoc
  description: Report checkdoc complaints and stop a commit that has any.
  entry: bin/elisp-checkdoc
  language: unsupported_script
  files: \.el$
  exclude: (-autoloads\.el|-pkg\.el|\.dir-locals\.el)$
  require_serial: true

- id: elisp-check-parens
  name: elisp check-parens
  description: Stop a commit with unbalanced parens, brackets, quotes or strings.
  entry: bin/elisp-check-parens
  language: unsupported_script
  files: \.el$
  exclude: (-autoloads\.el|-pkg\.el|\.dir-locals\.el)$
  require_serial: true

- id: elisp-check-byte-compile
  name: elisp check-byte-compile
  description: Stop a commit whose Emacs Lisp does not byte-compile cleanly.
  entry: bin/elisp-check-byte-compile
  language: unsupported_script
  files: \.el$
  exclude: (-autoloads\.el|-pkg\.el|\.dir-locals\.el)$
  require_serial: true

- id: elisp-check-declare
  name: elisp check-declare
  description: Verify declare-function forms and stop a commit where one is stale.
  entry: bin/elisp-check-declare
  language: unsupported_script
  files: \.el$
  exclude: (-autoloads\.el|-pkg\.el|\.dir-locals\.el)$
  require_serial: true
